<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyber Daily">
<meta name="theme-color" content="#0c0b09">
<title>Cyber Daily</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0c0b09;
  --surface: #141210;
  --surface-2: #1c1a16;
  --border: #282420;
  --border-hi: #3a342a;
  --cream: #f2e8d4;
  --cream-dim: #c4b89e;
  --cream-fade: #7a7060;
  --red: #c8242a;
  --red-soft: #f06060;
  --amber: #e0a030;
  --moss: #88a46a;
  --blue: #5090c8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  background:var(--bg);
  color:var(--cream);
  font-family:'IBM Plex Sans',-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none;
  min-height:100vh;
}
body{
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom)+24px);
  background-image:
    radial-gradient(ellipse 60% 30% at 15% 0%,rgba(200,36,42,.06) 0%,transparent 100%),
    radial-gradient(ellipse 50% 25% at 85% 100%,rgba(224,160,48,.04) 0%,transparent 100%);
}
.wrap{max-width:640px;margin:0 auto;padding:0 18px 60px}

/* ─── HEADER ─── */
header{padding:28px 0 22px;border-bottom:1px solid var(--border);margin-bottom:20px}
.wordmark{
  font-family:'Instrument Serif',serif;
  font-style:italic;
  font-size:40px;
  line-height:.92;
  letter-spacing:-.5px;
  display:flex;
  align-items:flex-end;
  gap:2px;
}
.slash{color:var(--red);font-style:normal;margin:0 1px}
.meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:12px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  letter-spacing:1.4px;
  text-transform:uppercase;
  color:var(--cream-fade);
}
.meta-date{color:var(--cream-dim)}
.live-pill{
  display:flex;
  align-items:center;
  gap:5px;
  color:var(--moss);
}
.live-dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--moss);
  box-shadow:0 0 7px rgba(136,164,106,.7);
}
.live-dot.loading{background:var(--amber);animation:pulse 1.2s infinite}
.live-dot.error{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ─── SECTION LABEL ─── */
.slabel{
  font-family:'JetBrains Mono',monospace;
  font-size:9.5px;
  text-transform:uppercase;
  letter-spacing:2.8px;
  color:var(--cream-fade);
  margin:32px 0 12px;
  padding-bottom:8px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:10px;
}
.slabel::before{content:"";width:12px;height:1px;background:var(--red)}

/* ─── STORY CARDS ─── */
.story{
  display:block;
  text-decoration:none;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  padding:15px 16px 13px;
  margin-bottom:10px;
  transition:border-color .15s;
  position:relative;
  overflow:hidden;
}
.story:active{border-color:var(--border-hi)}
.story-top{display:flex;align-items:center;gap:7px;margin-bottom:9px;flex-wrap:wrap}
.sev{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:600;
  letter-spacing:1.6px;
  padding:2px 7px;
  border-radius:2px;
  text-transform:uppercase;
  flex-shrink:0;
}
.sev.critical{background:rgba(200,36,42,.15);color:var(--red-soft);border:1px solid rgba(200,36,42,.3)}
.sev.high{background:rgba(224,160,48,.12);color:var(--amber);border:1px solid rgba(224,160,48,.28)}
.sev.notable{background:rgba(136,164,106,.1);color:var(--moss);border:1px solid rgba(136,164,106,.25)}
.source-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:var(--cream-fade);
  letter-spacing:.6px;
  flex-shrink:0;
}
.story-title{
  font-family:'Instrument Serif',serif;
  font-size:20px;
  line-height:1.18;
  color:var(--cream);
  margin-bottom:6px;
  letter-spacing:-.1px;
}
.story-desc{
  font-size:13.5px;
  line-height:1.55;
  color:var(--cream-dim);
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  margin-bottom:8px;
}
.story-foot{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--cream-fade);
  letter-spacing:.5px;
  display:flex;
  align-items:center;
  gap:8px;
}
.story-foot::after{content:"↗";font-size:11px;margin-left:auto;color:var(--cream-fade)}

/* ─── SKELETON ─── */
.skel{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  margin-bottom:10px;
  overflow:hidden;
  position:relative;
}
.skel::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.04) 50%,transparent 100%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{0%{background-position:200%}100%{background-position:-200%}}
.skel-line{height:10px;border-radius:3px;background:var(--surface-2);margin-bottom:8px}
.skel-line.w60{width:60%}
.skel-line.w80{width:80%}
.skel-line.w40{width:40%}
.skel-title{height:18px;border-radius:3px;background:var(--surface-2);margin-bottom:6px;width:90%}

/* ─── QUIZ ─── */
.quiz-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:6px;
  padding:16px;
  margin-bottom:10px;
}
.quiz-n{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:2px;
  color:var(--red);
  text-transform:uppercase;
  margin-bottom:5px;
}
.quiz-topic{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--cream-fade);
  margin-bottom:10px;
  letter-spacing:.5px;
}
.quiz-q{font-size:15px;line-height:1.52;color:var(--cream);margin-bottom:14px}
.quiz-input{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--border-hi);
  color:var(--cream);
  font-family:'IBM Plex Sans',sans-serif;
  font-size:15px;
  padding:11px 12px;
  border-radius:4px;
  resize:vertical;
  min-height:76px;
  line-height:1.5;
}
.quiz-input:focus{outline:none;border-color:var(--cream-fade)}
.quiz-input:disabled{opacity:.65}
.reveal-btn{
  margin-top:9px;
  width:100%;
  background:var(--red);
  color:var(--cream);
  border:none;
  padding:12px;
  border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:2px;
  cursor:pointer;
  min-height:44px;
}
.reveal-btn:active{background:#a01e22}
.reveal-btn:disabled{background:var(--border-hi);color:var(--cream-fade);cursor:default}
.answer-box{
  margin-top:12px;
  padding:13px 14px;
  background:var(--surface-2);
  border-left:2px solid var(--moss);
  border-radius:0 4px 4px 0;
  font-size:13.5px;
  line-height:1.62;
  color:var(--cream-dim);
  display:none;
}
.answer-box.open{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.answer-label{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  color:var(--moss);
  text-transform:uppercase;
  letter-spacing:2px;
  display:block;
  margin-bottom:6px;
}

/* ─── FOOTER ACTIONS ─── */
.actions{
  margin-top:36px;
  padding-top:18px;
  border-top:1px solid var(--border);
  display:flex;
  flex-direction:column;
  gap:8px;
}
.btn{
  background:var(--surface);
  border:1px solid var(--border-hi);
  color:var(--cream-dim);
  padding:13px;
  border-radius:4px;
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:2px;
  cursor:pointer;
  min-height:44px;
  text-align:center;
}
.btn:active{background:var(--surface-2)}

/* ─── ERROR BOX ─── */
.err{
  background:rgba(200,36,42,.07);
  border:1px solid rgba(200,36,42,.25);
  border-radius:5px;
  padding:14px;
  font-size:14px;
  line-height:1.55;
  color:var(--red-soft);
  margin-bottom:12px;
}
.err a{color:var(--cream);text-decoration:underline;cursor:pointer}

/* ─── EMPTY STATE ─── */
.empty{
  text-align:center;
  padding:40px 20px;
  color:var(--cream-fade);
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.5px;
  line-height:2;
}

/* ─── FOOTER ─── */
footer{
  margin-top:28px;
  text-align:center;
  font-family:'JetBrains Mono',monospace;
  font-size:9px;
  letter-spacing:1px;
  color:var(--cream-fade);
  line-height:2;
}

@media(max-width:390px){
  .wordmark{font-size:36px}
  .story-title{font-size:18px}
  .wrap{padding:0 15px 60px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="wordmark">Cyber<span class="slash">/</span>Daily</div>
    <div class="meta">
      <span class="meta-date" id="dateEl">—</span>
      <span class="live-pill"><span class="live-dot" id="dot"></span><span id="statusEl">Loading</span></span>
    </div>
  </header>
  <main id="main"></main>
  <div class="actions">
    <button class="btn" id="refreshBtn">↻ Refresh now</button>
    <button class="btn" id="resetQuizBtn">↺ Reset today's quiz</button>
  </div>
  <footer>
    The Hacker News · Krebs on Security · BleepingComputer · SecurityWeek · CISA<br>
    Cyber Daily — commuter edition
  </footer>
</div>
<script>
'use strict';

// ════════════════════════════════════════════════════════
//  QUIZ BANK — 60 manager-track questions, cycling daily
// ════════════════════════════════════════════════════════
const QUIZ = [
  {t:"NIST CSF 2.0",q:"NIST released CSF 2.0 in 2024, adding a sixth core Function to the original five (Identify, Protect, Detect, Respond, Recover). What is the new Function and what does it cover?",a:"GOVERN. It covers how an organisation establishes, communicates, and monitors its cybersecurity risk-management strategy, expectations, and policy — including organisational context, risk-management strategy, supply-chain risk, roles and responsibilities, policies, and oversight. The core point: cybersecurity is a board-level enterprise risk discipline, not just an IT concern. As a manager, GOVERN is where most of your work sits."},
  {t:"Zero Trust",q:"Name the three core principles of Zero Trust as defined by NIST SP 800-207, and explain why 'never trust, always verify' is incomplete as a definition.",a:"(1) Verify explicitly — authenticate and authorise every request using all available signals: identity, device posture, location, workload, data sensitivity. (2) Use least-privilege access — just-in-time, just-enough access with risk-adaptive policies. (3) Assume breach — minimise blast radius, segment access, encrypt end-to-end, use analytics for visibility. 'Never trust, always verify' misses the architectural shift: Zero Trust removes the network perimeter as the trust boundary. Identity, device, and workload become the new control plane, with policy enforced as close to the resource as possible."},
  {t:"Security Metrics",q:"MTTD and MTTR are the two most commonly reported SOC metrics. Define each, and name two ways they can be misleading if used in isolation.",a:"MTTD = Mean Time To Detect (from threat beginning to SOC identification). MTTR = Mean Time To Respond/Remediate (detection to containment/resolution). Two misleading aspects: (1) Selection bias — they only measure incidents you detected. A team that misses sophisticated intrusions entirely can show great MTTD on phishing alerts while real attackers dwell for months. Balance with ATT&CK detection coverage metrics. (2) Averages hide the tail — a median MTTR of 4 hours looks great until you see the worst 5% took 30 days. Report p50, p90, p99 by severity tier."},
  {t:"GDPR",q:"Under GDPR, what is the difference between a Data Controller and a Data Processor, and why does the distinction matter for contracts?",a:"A Controller determines purposes and means of processing — they decide why and how. A Processor processes on the Controller's behalf, following instructions. The distinction drives Article 28 contracts: every SaaS vendor touching personal data you control is likely a Processor, requiring a Data Processing Agreement specifying processing subject matter, duration, nature, purpose, confidentiality obligations, security measures, sub-processor approval, and cooperation with regulators. You are liable for Processor failures if you haven't done due diligence and signed a DPA."},
  {t:"Threat Modelling",q:"In the STRIDE model, what does each letter stand for, and which one is most often overlooked in cloud-native application design?",a:"Spoofing identity, Tampering with data, Repudiation (denying actions), Information disclosure, Denial of service, Elevation of privilege. Repudiation is most often overlooked in cloud-native design: developers focus on authentication and encryption but forget to implement comprehensive, tamper-evident audit logging. Without logs an attacker can deny performing actions, making incident response and forensics very difficult. SIEM, CloudTrail, and immutable log stores are the controls that address repudiation."},
  {t:"Incident Response",q:"Walk through the four phases of the NIST SP 800-61 Incident Response lifecycle and the key activity in each.",a:"(1) Preparation: build the capability before an incident — IR plan, playbooks, tabletop exercises, tooling, legal/comms relationships. (2) Detection & Analysis: identify that an incident is occurring and scope it — alert triage, log correlation, IOC matching, evidence preservation. (3) Containment, Eradication & Recovery: stop the spread, remove the threat, restore operations — isolation, credential resets, malware removal, patching, restore from known-good backups. (4) Post-Incident Activity: learn and improve — lessons-learned meeting, root cause analysis, playbook updates, executive briefing, metrics. As a manager your role is in Preparation (resources and authority) and Post-Incident (ensuring lessons are acted upon)."},
  {t:"ISO 27001",q:"What is the key difference between ISO 27001 and ISO 27002, and which does an organisation certify against?",a:"ISO 27001 is the certifiable standard — it specifies requirements for establishing, implementing, maintaining, and continually improving an ISMS. ISO 27002 is the code of practice — it provides detailed implementation guidance for Annex A controls. Organisations certify against ISO 27001 only. The 2022 revision reorganised Annex A from 114 controls in 14 domains to 93 controls in 4 themes (Organisational, People, Physical, Technological) and added 11 new controls covering threat intelligence, cloud security, and secure coding."},
  {t:"PKI / Cryptography",q:"Explain the difference between symmetric and asymmetric encryption and describe a real-world scenario where you'd use each.",a:"Symmetric encryption uses the same key for encryption and decryption (e.g. AES). It's fast and efficient for bulk data — disk encryption, database encryption, the bulk-data layer in TLS. The problem: how do two parties who've never met securely share the key? Asymmetric encryption (RSA, ECDH) uses a public/private key pair — encrypt with public, decrypt with private, or sign with private and verify with public. Used for: TLS handshake (exchange a session key), digital signatures (code signing, certificates), email encryption (S/MIME). In practice most systems use hybrid: asymmetric to establish a shared secret, symmetric to do the actual work."},
  {t:"Cloud Security",q:"What is the Shared Responsibility Model and how does it change across IaaS, PaaS, and SaaS?",a:"With IaaS (e.g. EC2): provider secures physical infrastructure and hypervisor; you secure OS, middleware, applications, data, networking, identity. With PaaS (e.g. RDS, App Engine): provider also manages OS and middleware; you secure application, data, access. With SaaS (e.g. Microsoft 365): provider manages almost everything; you are responsible for data governance, user access/identity, and endpoint security. The most common enterprise mistake: assuming 'the vendor handles security' for SaaS and neglecting data classification, backup, and access reviews."},
  {t:"Supply Chain",q:"What is an SBOM and why has it become a regulatory requirement in several jurisdictions?",a:"An SBOM (Software Bill of Materials) is a machine-readable inventory of every component in a software product — open source libraries, commercial components, versions, licences, dependencies. It became a regulatory requirement following SolarWinds (2020), which showed attackers could compromise software at build stage. US Executive Order 14028 and the EU Cyber Resilience Act mandate SBOMs. The operational value: when Log4Shell breaks, you immediately search your SBOM to answer 'which of our products use this library?' without manually auditing every codebase. Ask every software vendor and internal dev team for their SBOM."},
  {t:"Risk Management",q:"Define inherent risk, residual risk, and target risk. Which should appear in a board-level risk register, and why?",a:"Inherent risk = exposure before any controls. Residual risk = risk remaining after current controls (the actual risk you carry today). Target risk = the level management has formally accepted per risk appetite. The board register should show all three, but the most important conversation is the gap between residual and target. If residual > target: remediation programme to fund. If residual < target: potential over-investment in controls. Reporting only inherent or only residual hides this gap and produces poor capital-allocation decisions."},
  {t:"Identity & Access",q:"What is the principle of least privilege and name three common enterprise violations?",a:"Least privilege: every user, process, and system has only the minimum access rights needed to function. Three common violations: (1) Admin sprawl — IT staff have domain admin rights on their daily-use workstations. Fix: Privileged Access Workstations and just-in-time admin access. (2) Overprivileged service accounts — apps get Domain Admin because 'it was easiest'. Fix: scoped service accounts with only the permissions they need. (3) Stale access — employees accumulate permissions across role changes, old access is never revoked. Fix: quarterly access reviews, automated deprovisioning on role change, HR-triggered reviews."},
  {t:"SOC / SecOps",q:"What is SOAR and how does it relate to SIEM? Where does SOAR add value and where does it create risk?",a:"SIEM collects, correlates, and detects — it generates the alert. SOAR automates the response — enriches the alert, isolates an endpoint, resets a password, opens a ticket. They work together: SIEM detects, SOAR responds. SOAR adds value by reducing alert fatigue through automated triage, cutting MTTR via automated containment, and enforcing consistent process. SOAR creates risk when: playbooks are poorly tested and take incorrect automated actions; automation makes analysts passive; playbooks go stale and nobody reviews them. Safe practice: start with automated enrichment and notification only; add containment automation only for well-understood, high-confidence scenarios."},
  {t:"Post-Quantum",q:"What are NIST's three finalised post-quantum cryptography standards and what type of problem does each solve?",a:"ML-KEM (FIPS 203, formerly Kyber) — Key Encapsulation Mechanism, replaces ECDH/RSA key exchange in TLS and other protocols. ML-DSA (FIPS 204, formerly Dilithium) — digital signatures, replaces ECDSA and RSA signatures in code signing and certificates. SLH-DSA (FIPS 205, formerly SPHINCS+) — hash-based signatures, provides a backup to ML-DSA based on different mathematical foundations. TLS sessions need ML-KEM. Code-signing certificates and long-lived document signatures need ML-DSA. Start a cryptographic inventory now — enterprises take 5-10 years to migrate, and 'harvest now, decrypt later' attacks mean long-lived data encrypted today is already at risk."},
  {t:"Governance",q:"What is the difference between a security policy, standard, procedure, and guideline? Give an example of each.",a:"Policy: mandatory, high-level management intent — what must be achieved, not how. Example: 'All sensitive customer data must be encrypted in transit and at rest.' Standard: mandatory, specific technical requirement implementing a policy. Example: 'Data in transit must use TLS 1.2+; at rest AES-256.' Procedure: step-by-step operational guide for performing a specific task. Example: 'How to configure TLS on Nginx: step 1, open nginx.conf...' Guideline: non-mandatory advisory best practice. Example: 'Consider certificate pinning for mobile apps handling sensitive transactions.' Policies need board approval; standards need CISO approval; procedures are owned by technical teams; guidelines are advisory."},
  {t:"NIST CSF",q:"In NIST CSF 2.0, what is the difference between a Profile and a Tier, and how would you use each?",a:"A Profile describes your cybersecurity posture — what outcomes you want or currently achieve. A Current Profile shows where you are; a Target Profile shows where you want to be; the gap between them drives your roadmap. A Tier describes the sophistication and rigour of your risk management practices, from Tier 1 (Partial — ad hoc) to Tier 4 (Adaptive — proactive, risk-informed). Tiers aren't maturity levels to chase for their own sake; choose the right Tier based on your business risk and outcomes needed. In practice: use Profiles for gap analysis and planning, Tiers to communicate risk management maturity to leadership."},
  {t:"Zero Trust",q:"What are micro-segmentation and its difference from traditional VLAN-based network segmentation?",a:"Micro-segmentation divides a network into granular zones — often individual workload or application level — with separate access policies per zone. Unlike VLANs (network-layer constructs where east-west traffic within a VLAN is often unrestricted), micro-segmentation applies identity and policy controls to lateral traffic: a compromised workload can't move freely to adjacent systems. Implementation: host-based firewall policies, service mesh (Istio), or dedicated micro-segmentation platforms (Illumio). The operational challenge: effective micro-segmentation requires a detailed application-dependency map. You can't segment what you haven't catalogued."},
  {t:"GDPR",q:"What is a DPIA, when is it mandatory, and what are the key steps?",a:"A DPIA (Data Protection Impact Assessment) identifies and minimises privacy risks of new processing before it starts. It's mandatory under Article 35 when processing is 'likely to result in high risk' — systematic profiling with legal/significant effects; large-scale special-category data; systematic monitoring of public spaces; or activities on the ICO's required list. Key steps: (1) describe processing and purpose; (2) assess necessity and proportionality — least privacy-invasive approach? (3) identify risks to individuals; (4) identify mitigations; (5) document conclusions, obtain DPO sign-off. If high residual risks remain, consult the supervisory authority before proceeding."},
  {t:"Threat Modelling",q:"Walk through the PASTA threat modelling methodology and when you'd use it versus STRIDE.",a:"PASTA (Process for Attack Simulation and Threat Analysis) has seven stages: define business objectives → technical scope → decompose the application → analyse threats → identify vulnerabilities → enumerate attacks → risk/impact analysis. It produces a business-impact-prioritised list of risks with countermeasures — designed for risk decisions by leadership. STRIDE is an engineering-level checklist applied to data-flow diagrams, producing threats per component — useful for developer design reviews. Use STRIDE when you want engineers to enumerate threats systematically. Use PASTA when you need to connect threat findings to business risk and communicate prioritisation upward to non-technical stakeholders."},
  {t:"Incident Response",q:"What is the difference between a tabletop exercise and a red team exercise, and when is each appropriate?",a:"A tabletop is discussion-based: participants talk through responses to a hypothetical scenario without real technical actions. Tests communication, decision-making, escalation paths. Low cost, low disruption, suitable for any audience including executives and legal. Run quarterly. A red team exercise is a simulated adversarial attack using real TTPs against live systems. Tests whether detection and response capability actually works in practice — does your SIEM alert, does your IR team respond correctly? High cost, higher disruption risk, requires careful scoping and legal authorisation. Run annually, only once basic hardening and tabletop maturity is established."},
  {t:"ISO 27001",q:"What is a Statement of Applicability (SoA) in ISO 27001 and why is it considered the most important ISMS document?",a:"The SoA lists all 93 Annex A controls, states whether each is applicable, justifies exclusions, and describes implementation status of each applicable control. It's the definitive record of your control decisions — it shows auditors, customers, and leadership exactly which controls you have, why you've excluded any, and where you are in implementing the rest. It bridges risk assessment outputs to control implementation and is the primary artifact an ISO 27001 auditor will scrutinise. Exclusions must be robustly justified by risk assessment; you can't exclude a control because it's inconvenient."},
  {t:"Cryptography",q:"What is certificate pinning, what problem does it solve, and what operational risk does it introduce?",a:"Certificate pinning hardcodes an expected certificate or its public key hash in an application, so the app only trusts that specific certificate rather than any CA-issued one. Problem solved: a compromised or rogue CA could issue a valid cert for your domain enabling MITM attacks — pinning defeats this even if an attacker has a CA-signed cert. Operational risk: when you rotate your certificate, you must simultaneously update every app version that has the pin hardcoded. If you don't, apps that haven't updated fail to connect — a self-inflicted outage. Mitigation: pin the public key of your CA's intermediate root (not the leaf cert directly) and always include a backup pin."},
  {t:"Cloud Security",q:"What is CSPM and how does it differ from CASB?",a:"CSPM (Cloud Security Posture Management) continuously assesses cloud infrastructure configurations against security best practices and compliance frameworks (CIS, SOC 2, etc.) — S3 bucket left public, overly permissive security group, MFA disabled on root account. Answers: 'Is my infrastructure configured securely right now?' CASB (Cloud Access Security Broker) sits between users and cloud services, providing visibility and control over cloud application usage — shadow IT discovery, DLP (blocking upload of sensitive files), access control. Answers: 'What are my users doing in cloud apps, and am I losing data?' Both are needed in a mature programme."},
  {t:"Supply Chain",q:"What is 'dependency confusion' and what controls defend against it?",a:"Dependency confusion (namespace confusion) is a supply-chain attack where an attacker publishes a malicious package with the same name as an internal private package to a public registry (npm, PyPI). Build systems configured to check both internal and public registries often pull the public version if it has a higher version number. Documented by Alex Birsan in 2021 against Apple, Microsoft, PayPal. Defences: (1) use scoped package names (@mycompany/lib) that can't be replicated on public registries; (2) configure package managers to pull internal packages only from internal registries; (3) pin dependency versions with lockfile integrity hashes; (4) proactively squat your internal package names on public registries."},
  {t:"Risk Management",q:"What is the FAIR model and how does it enable more useful board conversations than qualitative risk matrices?",a:"FAIR (Factor Analysis of Information Risk) models risk in financial terms — Loss Event Frequency × Loss Magnitude — producing expected annual loss with confidence intervals rather than red/amber/green ratings. The board problem with heatmaps: a risk costing £50k and one costing £50M can both be 'High', which is useless for prioritisation. FAIR forces precision: 'Expected annual ransomware loss is £800k-£2M; our proposed £300k controls programme reduces this to £200k-£500k.' This enables comparing security investment ROI, prioritising by financial impact, and setting meaningful risk appetite thresholds. FAIR is the right tool when presenting investment cases to CFOs and boards who think in financial terms."},
  {t:"Identity & Access",q:"What is OAuth 2.0's implicit flow and why has it been deprecated in favour of PKCE?",a:"The implicit flow returned an access token directly in the URL fragment after user authorisation. Problem: tokens in URL fragments appear in browser history, server logs, and referrer headers. PKCE (Proof Key for Code Exchange, RFC 7636) solves this: the app generates a random code_verifier, hashes it to a code_challenge, sends the challenge to the authorisation server, receives an authorisation code (not a token), then exchanges it proving it knows the original verifier. The code in the URL has a short TTL and is single-use; the actual token never appears in a URL. OAuth 2.1 formally removes implicit flow. In 2026, no engineering team should use implicit flow."},
  {t:"SOC / SecOps",q:"What is threat hunting and how does it differ from reactive incident response?",a:"Threat hunting is proactive, human-led search for threats that have evaded existing detection — it assumes compromise and looks for evidence of it, rather than waiting for an alert. The hunter starts with a hypothesis (e.g. 'is an adversary using living-off-the-land binaries to move laterally?') and searches logs and endpoint telemetry for evidence. Reactive IR begins when an alert fires — you respond to a known signal. Threat hunting begins with no alert — you create the signal. This matters because sophisticated adversaries specifically design TTPs to avoid generating SIEM alerts. Hunting output feeds detection: find something → write a SIEM rule to catch it automatically next time."},
  {t:"Governance",q:"What is a security risk register and what must it contain to drive management decisions rather than just satisfy compliance?",a:"A risk register documents identified risks, likelihood/impact, current controls, residual risk, ownership, and treatment plans. To be useful for decisions rather than compliance: (1) Financial impact estimates, not just RAG ratings; (2) Named risk owners with real accountability; (3) Honest inherent vs residual gap — not padded with paper controls; (4) Treatment plans with deadlines, owners, and budget estimates; (5) Trend direction — is risk improving or worsening? (6) Links to critical business functions. A register updated once a year before an audit and never referenced between audits is a compliance artefact. A useful one is reviewed quarterly and drives budget conversations."},
  {t:"Email Security",q:"How do SPF, DKIM, and DMARC work together to prevent email spoofing, and what policy setting should you aim for?",a:"SPF publishes DNS records listing authorised sending IPs — receiving servers check if the sender IP matches. DKIM cryptographically signs outbound emails with a private key; receivers verify using the public key in DNS — proving the email came from your domain and wasn't modified. DMARC ties them together: specifies what to do when SPF/DKIM fails (none, quarantine, or reject), requires 'alignment' between the From: address and the authenticated domain, and sends aggregate reports. A domain with DMARC at 'reject' cannot be spoofed in phishing emails. Check your top domains — many organisations are stuck at 'none' (monitoring only) and never enforce it. Aim for p=reject."},
  {t:"Vulnerability Management",q:"What is a zero-day vulnerability, and what is the responsible disclosure timeline standard?",a:"A zero-day is a vulnerability unknown to the vendor — they have 'zero days' of warning before potential exploitation. Responsible disclosure: the researcher notifies the vendor privately, gives them a defined window to develop and release a patch (typically 90 days — Google Project Zero's standard), and publishes details after the patch is available or after the deadline passes. The 90-day standard has significantly accelerated vendor patching. For your patch SLA: zero-days in internet-exposed software should be 24-48 hours, not 30 days. Track Project Zero, CISA KEV, and vendor advisories — these are your early warning system."},
  {t:"Network Security",q:"What is 'living off the land' (LotL) as an attack technique and why is it effective against traditional AV/EDR?",a:"LotL uses legitimate, pre-installed system tools to carry out malicious activities rather than deploying custom malware. Common tools: PowerShell, WMI, certutil, mshta, regsvr32, rundll32. Effective against traditional AV because signature detection looks for known malicious files — PowerShell.exe is legitimate; there's nothing to detect. Effective against basic EDR lacking robust behavioural analysis. Defences: PowerShell Constrained Language Mode and Script Block Logging; WDAC application allowlisting; Privileged Access Workstations blocking internet from admin accounts; SIEM rules for encoded PowerShell, WMI event subscriptions, unusual certutil usage; EDR with strong behavioural detection for suspicious process chains (Office → PowerShell → cmd is almost always malicious)."},
  {t:"Business Continuity",q:"What is the difference between a BCP and a DRP, and how do RPO and RTO relate to each?",a:"BCP (Business Continuity Plan) addresses how the organisation continues critical business functions during a disruption — people, processes, facilities, communication as much as technology. DRP (Disaster Recovery Plan) specifically addresses IT system and infrastructure recovery — it's a subset of BCP. RTO (Recovery Time Objective): maximum acceptable time between a disruption and service restoration. If RTO is 4 hours, IT systems must be recoverable within 4 hours — requires warm standby systems. RPO (Recovery Point Objective): maximum acceptable data loss measured in time. If RPO is 1 hour, you must restore to a point no more than 1 hour before the disruption — requires hourly backups or synchronous replication. RPO and RTO should be business decisions driven by cost of downtime, not IT decisions."},
  {t:"Defence in Depth",q:"What is 'defence in depth' and what are the seven layers it typically describes?",a:"Defence in depth uses multiple security control layers so if one fails, subsequent layers still protect. Seven layers: (1) Policies, procedures & awareness — governance and human layer; (2) Physical security — facilities, locks, badge access; (3) Perimeter — firewalls, DMZ, network segmentation; (4) Internal network — IDS/IPS, VLANs, monitoring; (5) Host — endpoint hardening, EDR, patch management; (6) Application — secure coding, WAF, input validation, authentication; (7) Data — encryption, DLP, access controls, backup. Managerial value: maps to investment decisions. 'Where are we weakest across these layers?' is a better board conversation than 'how many CVEs did we find?'"},
  {t:"Penetration Testing",q:"What is the difference between a penetration test and a vulnerability assessment?",a:"A vulnerability assessment uses automated tools to catalogue known vulnerabilities — it answers 'what vulnerabilities exist?' and produces a CVE list with severity ratings. A penetration test goes further: a human tester actively exploits vulnerabilities to achieve a defined objective — domain admin, data access, lateral movement from a foothold. It answers 'can these vulnerabilities actually be exploited, and what's the real impact?' VA is broader but shallower; pen test is narrower but deeper. Run quarterly automated VA (or continuous) and annual pen tests minimum. When commissioning: specify scope precisely, agree rules of engagement in writing, ensure explicit legal authorisation covering all systems tested."},
  {t:"Identity & Access",q:"What is the difference between authentication and authorisation, and why is conflating them a common vulnerability source?",a:"Authentication answers 'who are you?' — verifying identity (password, MFA, certificate). Authorisation answers 'what are you allowed to do?' — determining resource access for an authenticated identity. They are separate operations, must be enforced separately. Conflating them creates IDOR (Insecure Direct Object Reference) vulnerabilities: a system checks you're logged in (authn) before showing an admin page, but doesn't verify you're actually an admin (authz). Fix: every API endpoint, every database query, every file access must independently verify that the authenticated identity has permission for this specific action — not just whether they're logged in."},
  {t:"Security Operations",q:"What is a Security Operations Centre and what are the key differences between Tier 1, 2, and 3 analyst roles?",a:"A SOC provides centralised monitoring, detection, analysis, and response to cybersecurity events. Tier 1: first line — monitors alert queues, performs initial triage (real or false positive?), escalates confirmed incidents, executes pre-defined runbooks. Needs breadth over depth. Tier 2: handles escalated incidents, deeper investigation, forensic analysis, identifies attacker TTPs, develops new detection logic. Needs stronger technical skills. Tier 3: handles the most complex incidents, leads major IR engagements, develops advanced detection rules, performs threat hunting, may overlap with research and red team. As a manager: Tier 1 burnout from alert fatigue is high. SOAR automation reduces this. Investing in Tier 1 development into Tier 2 reduces attrition and builds capability."},
  {t:"Supply Chain",q:"What is a 'watering hole' attack and how does it differ from spear phishing?",a:"A watering hole attack compromises a website the target group is known to visit, then delivers malware to visitors — rather than directly targeting victims. The attacker identifies sites frequently visited by their targets (industry associations, trade publications), compromises the site, and injects code that exploits browser vulnerabilities silently. Unlike spear phishing, the victim never clicks a suspicious email link — they visit a trusted, familiar website. Defenders focus on email; watering holes exploit web browsing. Defences: web proxy with reputation filtering; browser isolation; robust browser and plugin patching; threat intelligence monitoring for compromised sites relevant to your sector."},
  {t:"Application Security",q:"What is the OWASP Top 10 and how should a development team use it in practice?",a:"The OWASP Top 10 is a community-consensus list of the ten most critical web application security risk categories (current: 2021). A01 Broken Access Control, A02 Cryptographic Failures, A03 Injection, A04 Insecure Design, A05 Security Misconfiguration, A06 Vulnerable and Outdated Components, A07 Authentication Failures, A08 Software and Data Integrity Failures (new: supply chain), A09 Security Logging Failures, A10 SSRF. Development teams should use it as: a developer training framework; code review checklist; pen testing baseline; minimum security requirements bar. What it isn't: a comprehensive security standard — it covers common web vulnerabilities, not the full threat landscape. Map your WAF rules and SAST findings to Top 10 categories to demonstrate coverage."},
  {t:"Threat Intelligence",q:"What is a threat intelligence feed and how would you operationalise one in a SOC?",a:"A threat intelligence feed is a stream of structured data about threats — IOCs (malicious IPs, domains, file hashes, URLs), TTPs used by known threat actors, and campaign information. To operationalise: (1) Ingest feeds into your SIEM or Threat Intelligence Platform (MISP is the leading open-source TIP); (2) Automate IOC matching — SIEM queries automatically check log entries against the IOC database; (3) Enrich alerts — query the TIP when a SIEM alert fires to add context; (4) Update firewall/proxy blocklists with high-confidence malicious IPs; (5) Feed TTP information to detection engineers for rule improvement. Challenge: feeds contain false positives. Implement confidence scoring; don't auto-block without validation."},
  {t:"Network Security",q:"What is the difference between IDS and IPS, and where in a network architecture would you deploy each?",a:"An IDS (Intrusion Detection System) monitors network traffic or host activity and generates alerts when it detects suspicious patterns — it's passive, doesn't stop anything. An IPS (Intrusion Prevention System) does the same but sits inline and can actively block or drop malicious traffic. Deployment: IDS at a SPAN port or network tap where you want visibility without disruption — ideal for initial deployment, fine-tuning rules, and monitoring sensitive segments where false-positive drops would be unacceptable. IPS inline at network boundaries, between DMZ and internal network, and in front of critical systems — once rules are tuned. Both use signatures (known attack patterns) and anomaly/behavioural detection. In cloud environments, equivalent functionality comes from cloud-native tools (AWS GuardDuty, Azure Defender for Network) and NTA/NDR platforms."},
  {t:"Data Protection",q:"What is data classification and why must it precede data labelling?",a:"Data classification categorises data based on sensitivity and the impact of unauthorised disclosure, modification, or loss. Typical tiers: Public, Internal, Confidential, Restricted. The classification determines handling requirements — encryption standards, access controls, sharing restrictions, retention, disposal. Data labelling is the implementation — visually marking documents and files with their classification (headers, footers, sensitivity labels in Microsoft Purview). Classification must come first because labelling without classification is meaningless decoration — you're stamping documents without having decided what stamps mean or enforcing different handling based on them. The failure mode: creating four classification levels, training staff, but never implementing DLP or access controls. The labels become cosmetic."},
  {t:"Governance",q:"How should a CISO report cyber risk to a board with limited technical knowledge?",a:"Move from technical metrics to business risk language. Boards understand: financial loss, regulatory exposure, reputational damage, operational disruption — not CVE counts or CVSS scores. Effective approaches: (1) Quantified risk in financial terms using FAIR: 'Expected annual ransomware loss is £800k-£2M; our proposed £300k controls programme reduces this to £200k-£500k'; (2) Peer benchmarking against sector norms; (3) Red/amber/green against agreed risk appetite with trend direction; (4) Control coverage as business protection: '94% of endpoints have EDR; the 6% gap is our manufacturing floor'; (5) Single 'top 3 risks requiring board decision' rather than an exhaustive list. Every report should end with: 'We need you to approve X' or 'For information; no decision required.'"},
  {t:"Cryptography",q:"What is the 'harvest now, decrypt later' threat model and why does it make post-quantum cryptography urgent today?",a:"HNDL describes adversaries — particularly nation-states — capturing and storing today's encrypted traffic now, to decrypt it once a cryptographically-relevant quantum computer becomes available. Anything encrypted today using classical asymmetric algorithms (RSA, ECDH, ECDSA) is vulnerable to retrospective decryption if the data has a long confidentiality lifetime: trade secrets, M&A documents, health records, government communications. NIST's PQC standards (ML-KEM, ML-DSA, SLH-DSA) are finalised. Plan now because: (1) data encrypted today with a 20-year lifetime is already at risk; (2) crypto migrations take 5-10 years enterprise-wide. Start with a cryptographic inventory — where is RSA/ECC used, key sizes, lifetimes, system owners. Prioritise long-lived sensitive data flows."},
  {t:"Vulnerability Management",q:"What is CVSS and what are its limitations as a sole prioritisation tool?",a:"CVSS (Common Vulnerability Scoring System) provides a standardised numerical score (0-10) for vulnerability severity based on factors like attack vector, complexity, privileges required, user interaction, and impact on confidentiality, integrity, and availability. Limitations as a sole prioritisation tool: (1) It measures inherent severity, not exploitability in your environment — a Critical-rated vulnerability in software you don't use is less important than a High-rated one in your internet-facing login page; (2) It doesn't account for whether an exploit exists or is actively used — CISA KEV and exploit databases are better indicators of urgency; (3) CVSS scores can be inflated by theoretical impact. Better approach: combine CVSS with CISA KEV membership, active exploitation evidence, asset criticality, and network exposure to produce a contextual priority ranking."},
  {t:"Identity & Access",q:"What is identity federation and how does SAML 2.0 enable single sign-on between organisations?",a:"Identity federation allows users to authenticate once with their own organisation's identity provider and access services at partner organisations without a separate login. SAML 2.0 flow: user accesses the Service Provider (SP) → SP redirects to the user's Identity Provider (IdP) → user authenticates with their own credentials → IdP issues a signed XML assertion ('this user is authenticated') → assertion is POSTed back to the SP → SP validates the IdP's signature and grants access. The cryptographic signing is critical: the SP only trusts assertions signed by a known IdP certificate. Trust relationships are established in advance by exchanging metadata. Management implication: a compromised federated IdP can grant access to your systems — manage federation trusts carefully and review them regularly."},
  {t:"Application Security",q:"What does 'security by design' and 'privacy by design' mean in practice for a product team?",a:"Security by design: define security requirements, threat-model, and build controls in from the start. In practice: complete a threat model before architecture is finalised; security requirements are user stories alongside functional requirements; security champion embedded in the team; secure code review is part of definition of done; pen testing scheduled before launch. Privacy by design (GDPR Article 25): collect only data you genuinely need (data minimisation); set the most privacy-protective defaults; plan data deletion at end of life before collecting it; design access controls so only those who need the data reach it; complete a DPIA before building. As a manager: these are gates in your engineering process, not optional extras. A service without a threat model and DPIA shouldn't get a launch date."},
  {t:"Endpoint Security",q:"What is Endpoint Detection and Response (EDR) and how does it differ from traditional antivirus?",a:"Traditional AV relies on signature matching against known malware databases. Effective against commodity known malware; fails against novel malware, fileless attacks, and living-off-the-land techniques. EDR continuously records endpoint activity (processes, file operations, network connections, registry changes, memory) and uses behavioural analysis to detect suspicious activity even without a known malicious file. EDR detects: PowerShell making an unexpected network connection; Word document spawning cmd.exe; LSASS memory access (credential dumping). Response capabilities: isolate endpoint, kill process, collect forensic memory image, revert changes. When evaluating EDR: check ATT&CK evaluation results (ask for MITRE ATT&CK Evaluations round), false positive rate, and response automation capability."},
  {t:"Compliance",q:"What is Cyber Essentials (UK), what are its five technical controls, and when is it legally required?",a:"Cyber Essentials is a UK government-backed scheme certifying baseline security. Five controls: (1) Firewalls & routers — properly configured boundary firewalls; (2) Secure configuration — systems configured securely, unnecessary features removed; (3) User access control — least-privilege principles; (4) Malware protection — anti-malware or application allowlisting; (5) Patch management — software patched within 14 days of updates. Two levels: Cyber Essentials (self-assessed questionnaire) and Cyber Essentials Plus (technical verification via scanning). Required for: all UK government contracts involving personal data or ICT services (since 2014). It's a baseline against commodity internet threats, not a comprehensive security programme — it specifically does not address targeted nation-state attacks."},
  {t:"Security Operations",q:"What is a bug bounty programme and what are the key policy decisions when establishing one?",a:"A bug bounty programme invites external security researchers to discover and responsibly disclose vulnerabilities in exchange for financial rewards. Key decisions: (1) Scope — which systems are in scope? Vague scope leads to unintended testing; (2) Reward structure — fixed tiers by severity or variable? Higher rewards attract better researchers; (3) Safe harbour — explicit legal protection for researchers acting in good faith; without this, researchers fear prosecution; (4) Out-of-scope behaviours — typically: DoS, social engineering employees, accessing other users' data; (5) Disclosure timeline — 90 days for remediation is standard; (6) Platform vs self-managed — HackerOne/Bugcrowd provide community and triage; (7) Private vs public — start private (invitation only), go public only once your vulnerability management process is mature."},
  {t:"Risk Management",q:"What are the four risk treatment options, and give a real-world cybersecurity example of each?",a:"(1) Accept — acknowledge the risk and continue without additional controls, documented as a formal risk acceptance. Example: accepting the risk of a legacy internal system that can't be patched because cost of remediation exceeds expected loss and it's isolated. (2) Mitigate — implement controls to reduce likelihood or impact. Example: deploying MFA to reduce credential-theft risk. (3) Transfer — shift financial consequences to a third party. Example: purchasing cyber insurance; contractually transferring liability to a vendor for their systems. (4) Avoid — cease the activity that creates the risk. Example: discontinuing a service that processes payment cards because PCI-DSS compliance costs exceed its revenue. Most risks are mitigated or accepted; transfer supplements mitigation; avoidance is rare because it means stopping something the business values."},
  {t:"Network Security",q:"What is network traffic analysis (NTA) and what threats does it detect that EDR would miss?",a:"NTA captures and analyses network traffic metadata (or full packets) to detect malicious activity at the network layer. Detects threats EDR misses because: (1) Unmanaged devices — IoT, OT, printers, HVAC have no EDR agent; NTA monitors their traffic; (2) Encrypted traffic analysis — ML-based NTA identifies malicious patterns in TLS metadata without decryption (certificate details, timing, volume); (3) Lateral movement — unusual SMB traffic, unusual DNS queries, beaconing patterns between hosts; (4) Data exfiltration — large transfers to unusual destinations; (5) C2 communication — beaconing has distinctive timing signatures even over HTTPS. For OT/ICS environments where you can't install agents on industrial control systems, NTA is particularly valuable."},
  {t:"Governance",q:"What is shadow IT and what security and compliance risks does it create?",a:"Shadow IT: technology systems or services used by employees without IT/security knowledge or approval. Examples: personal Dropbox for work files, SaaS tools adopted without procurement review, developers deploying AWS on a personal credit card, using ChatGPT to process business data. Security risks: no security assessment; no DPA with processors; sensitive data in uncontrolled environments; no visibility for IR; access not revoked when staff leave. Compliance risks: personal data processed without GDPR legal basis; confidential data outside approved systems; IP sent to third-party AI training. Root cause: official tools are too slow or cumbersome. Solutions that work: fast-track approval (2-day review, not 6 months); pre-approved tool catalogue; CASB for visibility. Shadow IT is partly a symptom of IT not moving fast enough for the business."},
  {t:"Security Metrics",q:"What is a leading indicator versus a lagging indicator in security metrics? Give an example of each.",a:"Lagging indicators measure outcomes that have already occurred — they tell you what happened. Examples: number of incidents last quarter, MTTR last month, breach cost, vulnerabilities found in production. Accurate and concrete but retrospective — you can only react. Leading indicators measure activities predicting future outcomes — they tell you whether you're on track to prevent problems. Examples: percentage of critical vulns patched within SLA (predicts breach risk); phishing simulation click rate (predicts phishing susceptibility); MFA adoption rate (predicts credential-theft resilience); EDR endpoint coverage percentage (predicts detection capability). In board reporting: lagging = 'how did we do?' Leading = 'are we likely to be breached next quarter?' Mature programmes report both, with leading indicators framed against targets."},
  {t:"Cloud Security",q:"What is the difference between IaaS, PaaS, and SaaS cloud service models for a CISO assessing vendor risk?",a:"From a risk and due diligence perspective: IaaS (AWS EC2, Azure VMs) — you inherit more risk and control. You own OS hardening, patching, network config. Your team's misconfigurations are your risk. Requires strong cloud config management (CSPM). PaaS (AWS RDS, Google App Engine) — vendor manages more infrastructure; you focus on application security and data protection. Your data is still your responsibility. SaaS (Microsoft 365, Salesforce) — vendor manages almost everything. Your risks: data governance (backup, DLP, classification), identity and access management (who has admin rights?), and endpoint security for devices accessing the service. Due diligence scales with sensitivity: for SaaS holding sensitive data, require SOC 2 Type 2, DPA, penetration test reports, business continuity evidence, and subprocessor lists."},
  {t:"Incident Response",q:"What is a CSIRT and what is the role of the CISO during a major incident?",a:"CSIRT (Computer Security Incident Response Team) is the operational team managing the technical response — detection, analysis, containment, eradication, recovery. CISO is the executive providing leadership authority, making business continuity decisions (take the system down vs. keep running), managing executive and board communication, deciding whether to involve law enforcement, coordinating with legal and PR. The CISO should not be in the technical weeds during an incident — their role is to remove blockers for the response team and manage upward communication. A common failure mode: a CISO who micro-manages the CSIRT during an incident instead of managing the business response. Define decision rights before the incident, not during it."},
  {t:"Application Security",q:"What is a web application firewall (WAF) and what are its limitations as a security control?",a:"A WAF inspects HTTP/HTTPS traffic between the internet and web applications, applying rules to block malicious requests — SQL injection attempts, XSS payloads, known exploit patterns, OWASP Top 10 attack signatures. Typically deployed as a reverse proxy or cloud service (AWS WAF, Cloudflare). Limitations: (1) WAFs are primarily signature/rule-based — they can be evaded by obfuscated attacks or novel techniques; (2) Business logic flaws — a WAF can't detect that an attacker is placing orders with a negative quantity for a refund fraud; (3) False positives — overly aggressive rules block legitimate traffic; (4) TLS inspection — WAFs can't inspect encrypted traffic unless they terminate TLS (introduces cert management complexity); (5) Not a substitute for secure coding — a WAF is a defence-in-depth layer, not a replacement for fixing the underlying vulnerability. A WAF reduces the attack surface but doesn't eliminate it."},
  {t:"Cryptography",q:"What is a Hardware Security Module (HSM) and when should you use one versus software-based key management?",a:"An HSM is a dedicated hardware device that generates, stores, and manages cryptographic keys in a tamper-resistant physical environment. Keys cannot be extracted — operations happen inside the device and key material never exists in readable form outside. Use an HSM when: operating a CA (compromise of signing key undermines trust in every certificate it issued); payment processing (PCI-DSS requires HSMs for PIN encryption and certain key operations); high-assurance code signing (your update mechanism is a high-value supply-chain attack target); cloud KMS customer-managed keys for regulatory reasons. Software-based KMS (AWS KMS, HashiCorp Vault) is appropriate for most enterprise encryption needs. The threshold: if compromise of the key would constitute a catastrophic, organisation-ending event, use an HSM. If serious but recoverable, good software-based KMS with strict access controls suffices."},
  {t:"MITRE ATT&CK",q:"What is MITRE ATT&CK and how is it used in practice by security teams?",a:"MITRE ATT&CK is a curated knowledge base of adversary behaviours observed in real attacks, organised as a matrix of Tactics (adversary goals: Initial Access, Persistence, Lateral Movement, etc.) and Techniques (specific methods: Spearphishing Attachment, Pass-the-Hash, PowerShell, etc.). Used in practice for: (1) Detection engineering — mapping SIEM/EDR rules to ATT&CK techniques to identify coverage gaps; (2) Threat hunting — starting hunts with techniques relevant to adversaries targeting your sector; (3) Red team scoping — simulating specific technique coverage; (4) Vendor evaluation — asking vendors which techniques their product covers and verifying via MITRE ATT&CK Evaluations. As a manager: 'We detect 65% of relevant ATT&CK techniques' is more meaningful than 'we have an EDR deployed.'"},
  {t:"Data Protection",q:"What is a Data Processing Agreement (DPA) and what must it contain under GDPR Article 28?",a:"A DPA is a mandatory contract between a data controller and a data processor that governs how the processor handles personal data on the controller's behalf. Required contents under Article 28: (1) Subject matter, duration, nature, and purpose of processing; (2) Type of personal data and categories of data subjects; (3) Processor to act only on controller's documented instructions; (4) Confidentiality obligations on all staff processing the data; (5) Appropriate technical and organisational security measures; (6) Sub-processor restrictions — processor must get prior approval before engaging sub-processors; (7) Data subject rights — processor assists controller in responding to requests; (8) Deletion or return of data at end of service; (9) Cooperation with audits and supervisory authority investigations. Every SaaS vendor touching your EU personal data needs a DPA. DPAs without enforcement provisions are compliance theatre — ensure audit rights are real."},
  {t:"Network Security",q:"What is secure remote access and what are the security differences between VPN, ZTNA, and direct internet access?",a:"Traditional VPN places the remote user 'inside' the corporate network — once connected, they can often reach any internal resource. Compromised credentials or endpoint = broad network access. VPN gateways themselves are heavily targeted (Ivanti, Fortinet, Cisco CVEs are a perennial CISA KEV theme). ZTNA (Zero Trust Network Access) provides application-level access, not network-level. The user can access only specific authorised applications — never broad network access, never sees other internal systems. Each access decision is continuously evaluated. Blast radius of a compromised credential: one application, not the whole network. Migrating from VPN to ZTNA is a core Zero Trust initiative. The business case: VPN compromises have caused some of the largest breaches of the last three years."},
  {t:"Deception Technology",q:"What is a canary token and how would you use it as a deception technology in your environment?",a:"A canary token is a fake honeypot resource — a document, URL, database credential, email address, or AWS key — that has no legitimate use and should never be accessed. If it is accessed, it immediately alerts the security team. Example uses: a Word document titled 'Q4_Payroll_Confidential.docx' placed in a file share — if anyone opens it, a callback fires; fake AWS API keys placed in a code repository — if used, service alerts immediately; a canary admin account in Active Directory that should never log in — any login triggers an alert. Canary tokens are extremely high-fidelity: virtually no false positives because legitimate users have no reason to trigger them. They are cheap to deploy (canarytokens.org provides free implementations). They detect exfiltration or access, not prevention — a detection mechanism, not a control."},
  {t:"Identity Security",q:"What is credential stuffing, how does it differ from brute force, and what defences are effective against each?",a:"Credential stuffing uses username/password pairs stolen from one breached service against other services, exploiting password reuse. It's not guessing — it's replaying known credentials. Traditional failed-login rate limiting is less effective: the correct password may work on the first attempt. Brute force systematically tries all possible passwords or a dictionary against an account — generates high volumes of failed logins, more easily detected and blocked by lockout. Defences against credential stuffing: MFA (stolen password alone is insufficient); compromised credential checking (compare passwords against breach databases — Entra ID and Okta do this); device fingerprinting and anomaly detection (new device triggers step-up auth). Defences against brute force: account lockout after N failures; rate limiting; strong passwords; MFA. MFA is the single most effective control against both attacks."},
  {t:"Kill Chain",q:"What is the Cyber Kill Chain and how does it help with defensive prioritisation?",a:"The Kill Chain (Lockheed Martin, 2011) models a targeted attack as seven sequential stages: (1) Reconnaissance — research the target; (2) Weaponisation — create exploit payload; (3) Delivery — deliver via phishing, watering hole, USB; (4) Exploitation — execute exploit; (5) Installation — install persistence; (6) Command & Control — establish C2 channel; (7) Actions on Objectives — data theft, ransomware. Defensive value: you can interrupt an attack at any stage, and earlier interruption limits damage. This helps prioritisation: don't only invest in detecting Actions on Objectives (too late); build detection and prevention at multiple stages. Limitation: designed for targeted APT attacks, not all attack types fit the linear model. MITRE ATT&CK provides a more granular model; the Kill Chain remains useful for communicating layered defence to non-technical executives."}
];

// ════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════
const FEEDS = [
  {url:'https://feeds.feedburner.com/TheHackersNews', name:'The Hacker News', limit:5},
  {url:'https://krebsonsecurity.com/feed/', name:'Krebs on Security', limit:3},
  {url:'https://www.bleepingcomputer.com/feed/', name:'BleepingComputer', limit:3},
  {url:'https://feeds.feedburner.com/Securityweek', name:'SecurityWeek', limit:3},
  {url:'https://www.cisa.gov/cybersecurity-advisories/all.xml', name:'CISA', limit:2},
];
const RSS2JSON = 'https://api.rss2json.com/v1/api.json?rss_url=';
const CRITICAL_KW = ['critical','zero-day','0-day','actively exploit','emergency directive','remote code exec','authentication bypass','unauthenticated rce','actively being exploit'];
const HIGH_KW = ['vulnerability','exploit','ransomware','breach','data breach','cve-','patch','malware','privilege escalation','high severity','high-severity','attack','hacked','compromise'];

// ════════════════════════════════════════════════════════
//  UTILITIES
// ════════════════════════════════════════════════════════
const $ = id => document.getElementById(id);
function todayISO() { return new Date().toISOString().slice(0,10); }
function dayOfYear() {
  const now = new Date();
  return Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000);
}
function fmtDate(iso) {
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();
}
function timeAgo(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const mins = Math.floor((Date.now() - d) / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs/24)}d ago`;
}
function stripHtml(html) {
  const tmp = document.createElement('div');
  tmp.innerHTML = html || '';
  return tmp.textContent.trim();
}
function detectSeverity(title, desc) {
  const t = (title + ' ' + desc).toLowerCase();
  if (CRITICAL_KW.some(k => t.includes(k))) return 'critical';
  if (HIGH_KW.some(k => t.includes(k))) return 'high';
  return 'notable';
}
function escape(s) {
  return String(s||'').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// storage
function get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function set(k,v) { try { localStorage.setItem(k,v); } catch(e) {} }
function del(k) { try { localStorage.removeItem(k); } catch(e) {} }

// ════════════════════════════════════════════════════════
//  QUIZ SELECTION  (3 per day, spread across the bank)
// ════════════════════════════════════════════════════════
function todaysQuiz() {
  const day = dayOfYear();
  const n = QUIZ.length; // 60
  const spread = Math.floor(n / 3);
  return [
    QUIZ[day % n],
    QUIZ[(day + spread) % n],
    QUIZ[(day + spread * 2) % n],
  ];
}

// ════════════════════════════════════════════════════════
//  RSS FETCHING
// ════════════════════════════════════════════════════════
async function fetchFeed(feed) {
  const url = RSS2JSON + encodeURIComponent(feed.url) + '&count=' + (feed.limit + 2);
  const r = await fetch(url, {signal: AbortSignal.timeout(8000)});
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const data = await r.json();
  if (data.status !== 'ok') throw new Error('Feed error');
  return (data.items || []).slice(0, feed.limit).map(item => ({
    title: item.title || '',
    desc: stripHtml(item.description || item.content || '').slice(0, 220),
    url: item.link || item.guid || '',
    date: item.pubDate || '',
    source: feed.name,
  }));
}

async function fetchAllFeeds() {
  const results = await Promise.allSettled(FEEDS.map(f => fetchFeed(f)));
  const stories = [];
  let successCount = 0;
  results.forEach(r => {
    if (r.status === 'fulfilled') {
      stories.push(...r.value);
      successCount++;
    }
  });
  if (successCount === 0) throw new Error('All feeds failed');
  // sort by date, newest first, deduplicate by similar title
  stories.sort((a,b) => new Date(b.date) - new Date(a.date));
  const seen = [];
  return stories.filter(s => {
    const words = new Set(s.title.toLowerCase().split(/\W+/).filter(w => w.length > 3));
    const isDup = seen.some(prev => {
      const overlap = [...words].filter(w => prev.has(w)).length;
      return overlap > 3 && overlap / words.size > 0.55;
    });
    if (!isDup) { seen.push(words); return true; }
    return false;
  }).slice(0, 15);
}

// ════════════════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════════════════
function setStatus(text, mode) {
  $('statusEl').textContent = text;
  const dot = $('dot');
  dot.className = 'live-dot' + (mode ? ' ' + mode : '');
}

function renderStory(s) {
  const sev = detectSeverity(s.title, s.desc);
  return `<a class="story" href="${escape(s.url)}" target="_blank" rel="noopener">
    <div class="story-top">
      <span class="sev ${sev}">${sev}</span>
      <span class="source-tag">${escape(s.source)}</span>
    </div>
    <div class="story-title">${escape(s.title)}</div>
    ${s.desc ? `<div class="story-desc">${escape(s.desc)}</div>` : ''}
    <div class="story-foot">${timeAgo(s.date)}</div>
  </a>`;
}

function renderQuizCard(q, idx, total, state) {
  const done = state && state[idx];
  return `<div class="quiz-card" data-idx="${idx}">
    <div class="quiz-n">Question ${idx+1} of ${total}</div>
    <div class="quiz-topic">// ${escape(q.t)}</div>
    <div class="quiz-q">${escape(q.q)}</div>
    <textarea class="quiz-input" placeholder="Type your answer…" data-idx="${idx}"${done?' disabled':''}>${done ? escape(done.ans) : ''}</textarea>
    <button class="reveal-btn" onclick="reveal(${idx})"${done?' disabled':''}>
      ${done ? '✓ Revealed' : 'Submit & Reveal Answer'}
    </button>
    <div class="answer-box${done?' open':''}" id="ans-${idx}">
      <span class="answer-label">Model Answer</span>${escape(q.a)}
    </div>
  </div>`;
}

function renderBriefing(stories, fromCache) {
  const quiz = todaysQuiz();
  const quizStateRaw = get('cd:quiz:' + todayISO());
  let quizState = {};
  try { quizState = JSON.parse(quizStateRaw || '{}'); } catch(e) {}

  let html = '';

  // Top stories
  html += '<div class="slabel">Latest Stories</div>';
  if (stories.length === 0) {
    html += '<div class="empty">No stories loaded<br>Check connection and refresh</div>';
  } else {
    const critical = stories.filter(s => detectSeverity(s.title, s.desc) === 'critical');
    const rest = stories.filter(s => detectSeverity(s.title, s.desc) !== 'critical');
    [...critical, ...rest].forEach(s => { html += renderStory(s); });
  }

  // Quiz
  html += '<div class="slabel">Pop Quiz · Manager Track</div>';
  quiz.forEach((q, i) => { html += renderQuizCard(q, i, quiz.length, quizState[i]); });

  $('main').innerHTML = html;
  setStatus(fromCache ? 'CACHED' : 'LIVE', '');
}

function renderSkeleton() {
  let html = '<div class="slabel">Latest Stories</div>';
  for (let i = 0; i < 5; i++) {
    html += `<div class="skel">
      <div class="skel-line w40"></div>
      <div class="skel-title"></div>
      <div class="skel-line w80"></div>
      <div class="skel-line w60"></div>
    </div>`;
  }
  html += '<div class="slabel">Pop Quiz · Manager Track</div>';
  for (let i = 0; i < 3; i++) {
    html += `<div class="skel">
      <div class="skel-line w40"></div>
      <div class="skel-title"></div>
      <div class="skel-line w80"></div>
      <div class="skel-line w60"></div>
    </div>`;
  }
  $('main').innerHTML = html;
}

// ════════════════════════════════════════════════════════
//  QUIZ INTERACTIONS
// ════════════════════════════════════════════════════════
window.reveal = function(idx) {
  const card = document.querySelector(`.quiz-card[data-idx="${idx}"]`);
  const input = card.querySelector('.quiz-input');
  const ans = input.value.trim();
  if (!ans) {
    input.style.borderColor = 'var(--red)';
    input.focus();
    setTimeout(() => { input.style.borderColor = ''; }, 1500);
    return;
  }
  card.querySelector('.answer-box').classList.add('open');
  const btn = card.querySelector('.reveal-btn');
  btn.disabled = true;
  btn.textContent = '✓ Revealed';
  input.disabled = true;

  const key = 'cd:quiz:' + todayISO();
  let state = {};
  try { state = JSON.parse(get(key) || '{}'); } catch(e) {}
  state[idx] = { ans };
  set(key, JSON.stringify(state));
};

// ════════════════════════════════════════════════════════
//  FETCH & BOOTSTRAP
// ════════════════════════════════════════════════════════
async function loadFresh() {
  setStatus('FETCHING', 'loading');
  renderSkeleton();
  try {
    const stories = await fetchAllFeeds();
    set('cd:stories:' + todayISO(), JSON.stringify(stories));
    renderBriefing(stories, false);
  } catch(err) {
    // Try to show yesterday's cache as fallback
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    const fallback = get('cd:stories:' + yesterday);
    if (fallback) {
      try {
        renderBriefing(JSON.parse(fallback), true);
        $('main').insertAdjacentHTML('afterbegin',
          `<div class="err">Couldn't fetch fresh news (${escape(err.message)}). Showing yesterday's stories.
          <a onclick="refresh()">↻ Retry</a></div>`);
        return;
      } catch(e2) {}
    }
    setStatus('OFFLINE', 'error');
    $('main').innerHTML = `<div class="err">
      Couldn't load news (${escape(err.message)}).<br>
      Check your connection and <a onclick="refresh()">try again</a>.<br><br>
      If this is your first time: make sure the app is hosted on HTTPS (e.g. Netlify).
    </div>`;
  }
}

async function refresh() {
  del('cd:stories:' + todayISO());
  await loadFresh();
}

async function bootstrap() {
  $('dateEl').textContent = fmtDate(todayISO());
  const cached = get('cd:stories:' + todayISO());
  if (cached) {
    try {
      renderBriefing(JSON.parse(cached), true);
      return;
    } catch(e) {}
  }
  await loadFresh();
}

$('refreshBtn').addEventListener('click', refresh);
$('resetQuizBtn').addEventListener('click', () => {
  del('cd:quiz:' + todayISO());
  bootstrap();
});

bootstrap();
</script>
</body>
</html>
